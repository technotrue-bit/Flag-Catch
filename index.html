<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7cc4f2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flag Catch" />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237cc4f2'/%3E%3Crect x='9' y='5' width='3' height='23' rx='1.5' fill='%23fff'/%3E%3Cpath d='M12 6l13 5-13 5z' fill='%237ee36b'/%3E%3C/svg%3E"
    />
    <title>Flag Catch</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #7cc4f2;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-error" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:24px;text-align:center;font:700 16px system-ui,sans-serif;color:#2b2340;background:#7cc4f2"></div>
    <script>
      // Show a readable message instead of a blank sky if the game cannot start.
      (function () {
        function show(msg) {
          var el = document.getElementById("boot-error");
          if (!el || el.dataset.shown) return;
          el.dataset.shown = "1";
          el.style.display = "flex";
          el.textContent = "Flag Catch could not start: " + msg;
        }
        window.addEventListener("error", function (e) { show(e.message || "unknown error"); });
        window.addEventListener("unhandledrejection", function (e) { show(String(e.reason)); });
      })();
      // Two thumbs on the glass must never zoom or scroll the page. Phone
      // browsers can ignore user-scalable=no, so block pinch and double tap
      // zoom here too. Zoom lives in the game's own Settings instead.
      (function () {
        var stop = function (e) { e.preventDefault(); };
        ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
          document.addEventListener(t, stop, { passive: false });
        });
        document.addEventListener("touchmove", function (e) {
          if (e.touches.length > 1 || (e.scale !== undefined && e.scale !== 1)) e.preventDefault();
        }, { passive: false });
        var lastEnd = 0;
        document.addEventListener("touchend", function (e) {
          var now = Date.now();
          if (now - lastEnd < 320 && e.target && e.target.tagName !== "INPUT") e.preventDefault();
          lastEnd = now;
        }, { passive: false });
        document.addEventListener("wheel", function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
        document.addEventListener("keydown", function (e) {
          if ((e.ctrlKey || e.metaKey) && ["+", "=", "-", "0"].indexOf(e.key) >= 0) e.preventDefault();
        });
      })();
    </script>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
